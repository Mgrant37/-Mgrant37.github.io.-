<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title> Share your love of movies with us!</title>
  <link href="https://fonts.googleapis.com/css?family=Oswald:300,700|Varela+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
</head>
<body>
<header>
<!Formatting, unordered list>

    <nav>
        <ul>
            <li><a href="P1.html">Home</a></li>
            <li><a href="P2.html">Page 2</a></li>
            <li><a href="P3.html">Page 3</a></li>
            <li><a href="P4.html">Join Club</a></li>
        </ul>
    </nav>
</header>

<main>
 <h1> Join Movie Club </h1>

 <div id="clock-display" style="padding: 10px; background: #eee; margin-bottom: 10px;">
  <p> Current Time: <span id="currentTime"></span></p>
  <p id="countdownDisplay"></p>
 </div>

 <form id="registrationForm">

  <fieldset id="personalInfo">

   <legend> Contact details </legend>

   <label for="fullName">Full Name:</label>
   <input type="text" id="fullName" name="fullName" minLength="5" required>

   <label for="userEmail">Email Address:</label>
   <input type="email" id="userEmail" name="userEmail" required>

   <label for="zip">Zip Code:</label>
   <input type="text" id="zip" name="zip" pattern="[0-9]{5}" title="Five digit zip code">

   <label for="joinDate">Start Date:</label>
   <input type="date" id="joinDate" name="joinDate">

  </fieldset>

  <fieldset id="preferences">

   <legend>Movie interests</legend>
   
   <label>Favorite genre:</label>
   <input type="radio" name="genre" value="action"> Action
   <input type="radio" name="genre" value="drama"> Drama

   <label for="volume"> Notification Volume:</label>
   <input type="range" id="volume" name="volume" min=0 max=100>

   <label for="moviesPerMonth"> Movies watched per month:</label>
   <input type="number" id="moviesPerMonth" name="moviesPerMonth" min=0 max=50>

   <label><input type="checkbox" name="terms" required> I agree to terms</label>

   <label for="platform">Primary platform:</label>
   <input list="platforms" id="platform" name="platform">
   <datalist id="platforms">
    <option value= "Netflix">
    <option value= "Hulu">
    <option value= "Youtube movies">
   </datalist>

   <label for="country"> Region:</label>
   <select id="country" name="country">
    <option value= "na">North America</option>
    <option value= "sa">South America</option>
    <option value= "af">Africa</option>
    <option value= "eu">Europe</option>
    <option value= "as">Asia</option>
   </select>
  </fieldset>

<fieldset> 
 <legend> Additional Info</legend>
 <label for="comments">Comments:</label>
 <textarea id="comments" name="comments" rows="3"></textarea>
</fieldset>

  <div class="form-buttons">
   <button type="submit">Submit Registration</button>
   <button type="reset">Cancel</button>
  </div>
 </form>
</main>


<footer>
   <p> Our passion for cinema &bull;</p>
</footer>
<script>
 // Tutorial 9 requirement track time and day
 function updateClock() {
  const now = new Date();
//Requirement Convert number to text
 document.getElementById('currentTime').innerText = now.toLocaleString();
}
// Requirement Run a command at specific interval, every 1 second
 setInterval(updateClock, 1000);
//Reuirement Countdown function
function startCountdown() {
 let timeLeft = 10;
 const timerInterval = setInterval(function() {
 // Requirement Use math method
  let displayNum=Math.abs(timeLeft);
  document.getElementById('countdownDisplay').innerText="Club discount expires: " + displayNum + " seconds";
if (timeLeft <=0) {
 clearInterval(timerInterval);
 document.getElementById('countdownDisplay').innerText="offer expired";
}
timeLeft--;
}, 1000);
}
//Requirement Send an alert using JS
 window.onload=function() {
  alert("welcome to the member portal");
updateClock();
startCountdown();
};
</script>

</body>
</html>
